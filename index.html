<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj CDMX - Aviso de Corte</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="reloj-container">
        <div id="reloj">00:00</div>
        <div id="segundos">00</div>
    </div>

    <div id="contador" class="contador">
        ⏰ Próximo corte en: <span id="tiempo-restante">00:00</span>
    </div>
    
    <div id="aviso">
        ⚠️ ¡HORA DE CORTE! ⚠️<br>
        <span class="aviso-subtitulo">Rellena el formulario ahora</span>
    </div>
    
    <div class="info">
        <div class="zona">🇲🇽 Ciudad de México (GMT-6)</div>
        <div id="fecha"></div>
        <div class="estado" id="estado">Monitoreando cortes...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
